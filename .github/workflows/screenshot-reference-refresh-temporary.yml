name: Temporary screenshot reference refresh

on:
  push:
    branches:
      - codex/quality-download-fix

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Установить Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Пересоздать эталоны Compose
        run: ./gradlew --no-daemon updateDebugScreenshotTest
      - name: Зафиксировать обновлённые эталоны
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestDebug/reference/
          if git diff --cached --quiet; then
            echo 'Эталоны уже актуальны'
            exit 0
          fi
          git commit -m 'Обновить эталоны выбранного формата'
          git push origin "HEAD:${GITHUB_REF_NAME}"
