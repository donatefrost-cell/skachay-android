name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Установить Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Проверить и собрать
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: skachay-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SKACHAY_KEYSTORE_PASSWORD: ${{ secrets.SKACHAY_KEYSTORE_PASSWORD }}
      SKACHAY_KEY_ALIAS: ${{ secrets.SKACHAY_KEY_ALIAS }}
      SKACHAY_KEY_PASSWORD: ${{ secrets.SKACHAY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Установить Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Подготовить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.SKACHAY_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$SKACHAY_KEYSTORE_PASSWORD" "$SKACHAY_KEY_ALIAS" "$SKACHAY_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo 'Не настроены секреты для подписи выпуска' >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/skachay-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf 'SKACHAY_KEYSTORE_PATH=%s\n' "$keystore" >> "$GITHUB_ENV"
      - name: Собрать и проверить подпись
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon "-PreleaseVersion=$version" testDebugUnitTest assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Создать выпуск с APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --title "Скачай $version" \
            --notes "Скачайте файл app-release.apk и откройте его на телефоне с Android 8 или новее."
