name: Проверка выпуска на ARM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - name: Подготовить образ Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'system-images;android-30;google_apis;arm64-v8a'
          echo no | "$avdmanager" create avd --name skachay-arm --package 'system-images;android-30;google_apis;arm64-v8a' --device pixel_2
      - name: Проверить опубликованный APK
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          curl --fail --location --silent --show-error 'https://github.com/donatefrost-cell/skachay-android/releases/latest/download/app-release.apk' -o "$RUNNER_TEMP/app-release.apk"
          "$ANDROID_HOME/emulator/emulator" -avd skachay-arm -no-window -no-audio -no-boot-anim -no-snapshot -accel off -gpu swiftshader_indirect -memory 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          booted=false
          for i in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            if [ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          "$adb" -s emulator-5554 shell input keyevent 82
          "$adb" -s emulator-5554 install "$RUNNER_TEMP/app-release.apk"
          "$adb" -s emulator-5554 shell am start -n ru.skachay.app/.ShareActivity -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT 'https://youtu.be/O8G5Mkzhe4s'
          for i in $(seq 1 60); do
            media=$("$adb" -s emulator-5554 shell content query --uri content://media/external/video/media --projection _id:_size:is_pending 2>/dev/null || true)
            if echo "$media" | grep -Eq '_size=[1-9][0-9]{4,}.*is_pending=0'; then
              echo 'Опубликованный ARM APK скачал видео и сохранил его в галерее.'
              exit 0
            fi
            sleep 5
          done
          "$adb" -s emulator-5554 logcat -d -s Skachay:D AndroidRuntime:E || true
          echo 'Видео не появилось в галерее за отведённое время.' >&2
          exit 1
